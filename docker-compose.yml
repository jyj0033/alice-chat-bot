services:
  alice-chat-bot:
    build: .
    container_name: alice-chat-bot
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "30080:30080"
      - "3001:3001"
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
      ALICE_DASHBOARD_USERNAME: ${ALICE_DASHBOARD_USERNAME:-admin}
      ALICE_DASHBOARD_PASSWORD: ${ALICE_DASHBOARD_PASSWORD:-}
    networks:
      - bot-network

networks:
  bot-network:
    external: true
