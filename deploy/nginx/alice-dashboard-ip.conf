# Install as /etc/nginx/sites-available/alice-dashboard-ip after the IP
# certificate has been issued. The dashboard app enforces Basic Auth.
server {
    listen 30080 ssl;
    server_name 101.43.221.18;

    ssl_certificate /etc/nginx/ssl/alice-dashboard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/alice-dashboard/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:alice_dashboard_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:30081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
