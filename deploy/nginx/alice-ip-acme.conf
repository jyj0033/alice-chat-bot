# Install before issuing the IP-address certificate. Keep this enabled so
# short-lived certificates can renew through HTTP-01 without stopping Nginx.
server {
    listen 80;
    server_name 101.43.221.18;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
